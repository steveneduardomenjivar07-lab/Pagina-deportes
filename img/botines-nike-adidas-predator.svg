    <linearGradient id="predatorUpper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454a46"/>
      <stop offset="1" stop-color="#101411"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.3" width="1.5" height="1.7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="10"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
