<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Botines Nike y Adidas Predator</title>
  <desc id="description">Dos botines de fútbol: uno Nike naranja y uno Adidas Predator negro con detalles rojos.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27362d"/>
      <stop offset="1" stop-color="#0b1510"/>
    </linearGradient>
    <linearGradient id="nikeUpper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7447"/>
      <stop offset="1" stop-color="#c92716"/>
